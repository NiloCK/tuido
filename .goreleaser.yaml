# .goreleaser.yaml
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - netbsd
      - openbsd
      - freebsd
      # - plan9
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: netbsd
        goarch: arm64
      - goos: freebsd
        goarm: arm64
      - goos: plan0
        goarm: arm64

archives:
  - format: tar.gz
    # this name template matches the internal download logic of tuido-npm/install.js
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

